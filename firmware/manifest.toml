[[not_shipped]]
id = "geni-qupv3fw"
component = "soc-boot"
linux_path = "qcom/x1e80100/qupv3fw.elf"
reason = "No Denali DT node sets firmware-name on qupv3_0/1/2 (sources/linux/arch/arm64/boot/dts/qcom/x1-microsoft-denali.dtsi:1026-1037; hamoa.dtsi has none). geni_load_se_firmware() (sources/linux/drivers/soc/qcom/qcom-geni-se.c:1553-1601) is only called when an engine reports GENI_SE_INVALID_PROTO (i2c-qcom-geni.c:1083-1084, spi-geni-qcom.c:650-651, qcom_geni_serial.c:1359-1360) and without the property it fails with -EINVAL (qcom-geni-se.c:1565-1568). Only hamoa-iot-som.dtsi:450,456,462 sets qcom/x1e80100/qupv3fw.elf."
source_if_needed = "Fedora qcom-firmware /usr/lib/firmware/qcom/x1e80100/qupv3fw.elf.xz (sha256_packaged 448c37c85f55b73dc038dca389774d9417051d9a28af5d03e12e443684b93f62, decompressed dcb4ca490098f081dd3f85d91ca230c4755d376a4cdca51e6a4ba918fa4ab077). The DriverStore has no qupv3 file (MANIFEST.sha256 has no match)."
revisit_when = "M2 log shows an engine used by touch, pen or sensors failing with 'firmware load failed' or proto 0; then a Denali DT patch must add firmware-name to the qupv3 node (request to soc-boot/kernel), no new file is needed because qcom-firmware is installed anyway."
grade = "Verified (code and package list); need on this unit is TBD"

