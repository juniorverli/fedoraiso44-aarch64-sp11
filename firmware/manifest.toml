[[not_shipped]]
id = "svcmap-group-note"
component = "dsp-subsystems"
reason = """The five *.jsn service maps are not needed. (1) Fedora 44 has no pd-mapper: qrtr-1.2-2.fc44 'Obsoletes: pd-mapper < 1.0-6' and ships only qrtr-cfg and qrtr-lookup (dnf repoquery, Verified 2026-10-24); no package provides /usr/bin/pd-mapper. qrtr-ns is gone too, the kernel has it (sources/linux/net/qrtr/Makefile:3, ns.c). (2) Linux 7.3 has an in-kernel protection domain mapper: drivers/soc/qcom/qcom_pd_mapper.c, table x1e80100_domains at :609-616 selected by the root compatible 'qcom,x1e80100' (:666; the Denali root compatible lists it, x1p64100-microsoft-denali.dts:13-14), started as an auxiliary device when the ADSP boots (qcom_common.c:550-562, qcom_q6v5_pas.c:918). Fedora builds it: CONFIG_QCOM_PD_MAPPER=m, CONFIG_QRTR=m (out/build/kernel/rpmbuild/SOURCES/kernel-aarch64-fedora.config:6868,6945). (3) The kernel table equals the Windows maps domain for domain: adsp root_pd, sensor_pd, audio_pd (avs/audio), charger_pd, all instance 74, and cdsp root_pd instance 76 (qcom_pd_mapper.c:253-312) (Verified by reading all five .jsn; each is also byte-identical to Fedora qcom-firmware 20261019 qcom/x1e80100/LENOVO/21N1/<same name>, Verified by SHA-256). Only difference: Windows adspr.jsn also lists tms/pdr_enabled, which the kernel adds only in adsp_root_pd_pdr (:280-287), not used by x1e80100_domains; nothing in the kernel looks that service up (grep), the remote DSP does (Hypothesis, harmless as on other X1E laptops). Where a userspace pd-mapper would read maps: upstream pd-mapper reads them under /lib/firmware next to the remoteproc firmware (Hypothesis from memory of the upstream tool, not verified here, not needed)."""
revisit_when = "dmesg at M2 shows 'PDM: no support for the platform' (qcom_pd_mapper.c:690) or the ADSP service registry fails; then compare the in-kernel table with the .jsn files above."
grade = "Verified (code, package metadata, .jsn content); the fallback path of a userspace tool is Hypothesis"
