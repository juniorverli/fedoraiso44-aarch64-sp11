# Firmware manifest. Owner: firmware worker.
# Maps a Windows file (by DriverStore path and SHA-256) or a Fedora linux-firmware
# file to the path the Linux 7.3 kernel requests. No binary is ever stored in git.
# scripts/firmware-stage.sh copies the `driverstore` blobs into
# out/firmware-root/lib/firmware/<linux_path> after verifying every SHA-256.
# `linux-firmware` blobs are NOT copied: the image installs the Fedora package.
#
# Citations are relative to the project root; "sources/linux/<file>:<line>" is a
# line in the pinned v7.3 tree (kernel/base.toml). Grades follow agents/protocol.md §5.
#
# [[blob]] fields
#   id            stable key
#   component     hardware/<component> that needs the file
#   linux_path    path below /lib/firmware that the kernel requests (exact string)
#   requested_by  where the NAME comes from (DT firmware-name or driver table)
#   loaded_by     the code that opens the file and what it does with it
#   origin        "driverstore" | "linux-firmware"
#   status        "needed" | "mapped" | "verified-on-device"
#                 mapped = requesting code AND source are both cited
#   driverstore:    source (path below sources/windows), sha256, size, windows_name
#                   (only when the Windows name differs), catalog (binary-catalog.tsv path)
#   linux-firmware: package, package_path (path inside the RPM), sha256_packaged
#                   (SHA-256 of the file as shipped, .xz), sha256 (of the decompressed
#                   content the kernel sees)
#
# [[package]]  Fedora 44 packages the image must install (D12). Pins record what
#              was seen with `dnf repoquery` in registry.fedoraproject.org/fedora:44.
# [[not_shipped]]  files that exist and were considered, but no code in the
#              phase 1 configuration requests them. Recorded so nobody re-asks.

# ---------------------------------------------------------------------------
# Fedora packages
# ---------------------------------------------------------------------------

[[package]]
name = "qcom-firmware"
# linux-firmware 20260309 and later is split into subpackages; `linux-firmware`
# (the meta package) only recommends amd-gpu, intel, realtek, ... and does NOT
# pull qcom-firmware (checked with --recommends/--whatrecommends/--whatrequires).
# The image must name `qcom-firmware` explicitly.
