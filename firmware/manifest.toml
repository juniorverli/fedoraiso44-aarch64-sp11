fedora_release_rpm_sha256 = "8fb8205fb161943aca3c1f5dbaf5b1bdf41cbf116cbae85f0ae7628718fe2d1b"
fedora_updates = "qcom-firmware-0:20261019-1.fc44.noarch"
fedora_updates_rpm_sha256 = "b72830ace787efe3856e8dac80dfbbb72a02ce65fb4bfcb7c2a508ee99bb48b8"
checked = "2026-10-24"
