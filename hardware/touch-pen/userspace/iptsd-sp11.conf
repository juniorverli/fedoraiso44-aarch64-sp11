# SP11 touch profile B for iptsd 3.1.0 (045E:0C80). Install as /etc/iptsd.d/50-sp11.conf.
# Profile A is this file ABSENT: iptsd then uses its compiled defaults (Activation 40, Deactivation 36,
# Neutral mode, no offset), which is what the M13/M14b boots ran.
#
# Every value below is copied from upstream: the Contacts block of presets/surface-laptop-studio-2.conf in
# the iptsd v3.1.0 tag (Microsoft 045E:0C46, the nearest newer Surface touch device with a preset). iptsd
# ships no preset for 045E:0C80 (Verified: etc/presets in the v3.1.0 tarball). Documented range of all four
# values is 0-255 (etc/iptsd.conf in the same tarball). Nothing here is tuned for this unit.
#
# Effect (Verified in src/core/generic/config.hpp and src/contacts/detection): a heatmap pixel starts a
# contact when it exceeds neutral + ActivationThreshold/255; neighbours join above neutral +
# DeactivationThreshold/255. Lower thresholds make a light or brief tap detectable. Neutral = average uses
# the mean of the heatmap as the base instead of the most common value; NeutralValue adds an offset to it.
# Whether this panel needs it is Unknown until the A/B comparison below has been run.
#
# A/B: boot with the marker set to A, run sp11-touch-tap-diag 30 and tap 30 times; reboot with the marker
# set to B and repeat. Count taps made by hand against the "iptsd virtual touchscreen: N touches" line.

[Device]
Vendor = 0x045E
Product = 0x0C80

[Contacts]
Neutral = average
NeutralValue = 10
ActivationThreshold = 20
DeactivationThreshold = 16

# NOT enabled; step C, only if the collector shows heatmap reports during a tap but no touch-down (see the
# evidence file). The validator in iptsd 3.1.0 is sticky: a contact whose first frame fails the size or
# aspect test stays invalid for its whole life and is never sent to the kernel (src/contacts/validation,
# src/apps/daemon/touch.hpp). Upstream defaults, for reference only:
#   SizeMin = 0.2   (cm, smallest allowed major axis)
#   SizeMax = 2.0
#   AspectMin = 1.0
#   AspectMax = 2.5
# The upstream presets never change these four keys, so there is no upstream value to borrow for step C.
