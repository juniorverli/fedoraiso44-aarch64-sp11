gaps = ["CDSP GLINK edge does not acknowledge channels Linux opens (IPCRTR, fastrpc: -ENOMEM from a 5 s timeout), root cause TBD, not on the usable-tablet path", "two Battery supplies (SSAM BAT1 and qcom-battmgr-bat) report the same cell: userspace must pick one (ec-sam)", "qcom-battmgr-bat charge_control_* thresholds are writable and the driver does not know the firmware limit (S6)", "ADSP audio framework does not answer APM_CMD_GET_SPF_STATE within 5 s (audio workers; S1 not involved)", "pd-mapper and PDR lookups are pr_debug only: dynamic debug needed for the next boot"]

[firmware]
