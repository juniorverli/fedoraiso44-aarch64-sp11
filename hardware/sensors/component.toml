id = "sensors"
name = "Sensors on the ADSP sensor core (SSC): accelerometer, gyroscope, magnetometer, ambient light, orientation"
phase = 4
status = "testing"
depends_on = ["dsp-subsystems"]
updated = "2026-11-02"

[windows]
hardware_ids = ["ACPI\\VEN_MSHW&DEV_048A&SUBSYS_MSHW0487", "ACPI\\VEN_MSHW&DEV_048B&SUBSYS_MSHW0487", "Simple Device Orientation Sensor"]
packages = ["qcsensors", "surfacepro_snscfgcrd8380", "sensorshidclassdriver", "sensorsalsdriver", "sensorsservicedriver"]

[linux]
drivers = ["misc/fastrpc", "userspace: hexagonrpcd, libssc, iio-sensor-proxy"]
dt = []
native = "none"
gaps = ["M16 daemon executes despite systemd seccomp rule-add EDOM warnings; effective filter coverage and exact architecture failure remain unverified", "hexagonrpcd 0.5.0 rejected an input over 256 bytes and restarted; continuation semantics and impact on SSC data need investigation", "M16 image helper reported 293 seeds in nested registry; on-device ownership and seed compatibility are unverified; daemon reported missing names and fstempfile without open modes", "Live accelerometer, orientation and ambient-light events remain unverified; collector ran at shutdown", "ALS is diagnostic only; automatic brightness is disabled and locked by image policy", "tmd2755.json truncated in the Windows package (proximity)"]

[firmware]
needs = ["ADSP sensor registry and config (from surfacepro_ext_adsp8380 / surfacepro_snscfgcrd8380)"]
