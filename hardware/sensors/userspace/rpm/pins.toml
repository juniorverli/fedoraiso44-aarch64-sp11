upstream_commit = "0085ddf8ecb173a1c5fcf2344aa40e561125354f"
license = "GPL-3.0-or-later"
provenance = "GitLab API: MR 381 'libssc support' state merged 2026-02-08; tag 3.9 (2026-03-02) -> 0085ddf8; meson.build 3.9 has libssc_dep and src/drv-ssc-*.c. Fedora rawhide builds 3.9 with ssc-support=disabled; Fedora 44 ships 3.8-2 (no SSC). The GitLab archive URL is the one Fedora's spec uses; GitLab does not promise stable archives, so the hash is the control."
