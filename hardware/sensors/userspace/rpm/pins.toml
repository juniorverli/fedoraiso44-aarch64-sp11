# Provisional source pins for the sensor RPMs (hardware/sensors). The sources worker is asked to copy these
# tables into sources/sources.toml (README "Requests"); build-sensors-rpms.sh reads sources/sources.toml first and
# falls back to this file with a warning. The archive hashes are verified before anything is built either way.
# Each pin was checked against the upstream API on 2026-10-31 (GitHub, Codeberg/Forgejo, GitLab).

[hexagonrpcd]
# Source project name is hexagonrpc; the daemon package is hexagonrpcd.
version = "0.5.0"
archive_url = "https://github.com/linux-msm/hexagonrpc/archive/refs/tags/v0.5.0.tar.gz"
archive_sha256 = "2173985932ab68d8ac593f9954357123bdbbbe9ba5f1b17a098d9cbcec22c5d5"
upstream_commit = "435ed1cd68e20f8a9fe4871233ed1f8ce7ccf9e8"
license = "GPL-3.0-or-later"
provenance = "GitHub API repos/linux-msm/hexagonrpc/tags: v0.5.0 -> 435ed1cd. Tools/sscregistrygen.c and apps_std.def read from the tarball."

