# SP11: iio-sensor-proxy is started by udev when /dev/fastrpc-adsp appears, which is before the sensors
# daemon serves the ADSP. Order the proxy after it so libssc finds the SSC service sooner (libssc keeps
# retrying for up to 100 s either way). A missing daemon (public image) does not block the proxy.
[Unit]
After=hexagonrpcd-sensors.service
Wants=hexagonrpcd-sensors.service
