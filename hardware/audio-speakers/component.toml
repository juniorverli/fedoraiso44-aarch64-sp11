gaps = ["Install-entry D26 boot has a refused speaker policy and no helper-selected sink or source; the shared profile failure mechanism and independent mic signal remain unproven. Proposed CL safe entry raises caps only through the kernel guard (marker plus SP module, patch 0033) and keeps the amplifier unmute guard-gated; verify CLOSED_LOOP with SP, VI and calibration at the first playback", "Closed-loop calibration mask can survive a VI graph that closes before start and satisfy a later graph whose calibration file is missing; kernel fail-closed lifetime fix and negative tests required", "Private ISO f44ef stages model-matched CL supplements but firmware-loader selection on device remains unverified", "The candidate supervisor verifies negotiated S16 48 kHz stereo, MultiMedia5, RUNNING/XRUN and frame progress without reading samples; real PCM behavior is unverified and the trigger carries no host V/I data", "Linux configures two codec DMA channels and expands two speakers to four VI entries matching the keyless ACDB map; actual DMA packing, SP count and SoundWire semantics need evidence", "REA MCP session was again refused by the never-approval policy; catalog-forced AArch64 analysis of parameter order, count, R0/T0, gains and maps remains open", "Speaker enable failed twice; the redundant userspace-only Speakers Volume cset was removed from canonical and retained inputs, but the leading cause still needs a device trace and candidate retest", "0x0200 amplifier interrupt during reboot with PA off has unknown meaning; retain fail-closed latch until independently decoded", "software sink and stream levels during low playback were not captured; parity events need monitored recurrence", "rev19 PA controls at 0 with max 6 versus rev18 6 with max 31; enable restoration, alias, verb re-selection, BootSequence and disable/enable transitions need device verification", "D32-D34 startup mute, route defaults, first-test level and effective digital gain require device validation; clamp required if 100 percent raises digital 72 to 81", "round-3 DMIC route matches rev18 but post-session default source and nonzero stereo capture RMS are unverified", "duplicate topology module IDs are logged without propagating an error; candidate 0025 needs real parser and cleanup tests; closed-loop topology parsed offline but ADSP acceptance unknown: control link across two graphs (H3) and trigger front end with unconnected input (H10); design B (Qualcomm RFC) is the M15 fallback", "measured per-unit R0/T0 flow, DSP readback and Windows cooldown/recalibration policy are not implemented", "no readback of Re/T from the DSP", "sense gain operating point and port map unverified on hardware", "VI-only diagnostic generation explicitly requires CPS at the guard, but the topology has no CPS chain; real V/I or CPS observation and actual supervisor liveness remain unverified", "M15.1 safe/Spectra logs do not exercise speaker graph; WSA macro flat-cache warning observed twice but register/caller unknown", "Full-context 0021 is in the series; lifetime candidate and component patches 0024-0027 are not integrated or compiled; degraded diagnostics and DSP event coverage remain unverified", "M16 DP1 route listed but active mixer switch and opener unknown", "M16 safe DIE cause unknown; speaker-enabled fallback violates D26 speaker-off fallback requirement and needs isolation and device evidence", "Closed-loop ceilings are now WSA RX/MIX 84 (0 dB) and PA 17 (+16.5 dB) via patch 0032 only in SP11_MODE_CLOSED_LOOP; the acoustic SPL/dB mapping, the Speakers Volume remap maximum after the raised cap, and the nominal-calibration margin at Windows-max level are unmeasured"]

