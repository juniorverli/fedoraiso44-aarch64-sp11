# Replaces /codecs/qcom-lpass/wsa-macro/init.conf (upstream 84 = 0 dB, above the kernel ceiling).
# Control names carry the "WSA " prefix from sound-name-prefix in the DT.
BootSequence [
	cset "name='WSA WSA_RX0 Digital Volume' 78"
	cset "name='WSA WSA_RX1 Digital Volume' 78"
	cset "name='WSA WSA_RX0_MIX Digital Volume' 78"
	cset "name='WSA WSA_RX1_MIX Digital Volume' 78"
	cset "name='WSA WSA_COMP1 Switch' 0"
	cset "name='WSA WSA_COMP2 Switch' 0"
	cset "name='SpkrLeft PA Volume' 0"
	cset "name='SpkrRight PA Volume' 0"
]
