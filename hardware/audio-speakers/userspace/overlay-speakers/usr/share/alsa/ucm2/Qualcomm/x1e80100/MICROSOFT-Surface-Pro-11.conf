# D26 SPEAKER OVERLAY. Install ONLY in the entry that boots the m13-spk DTB (sp11.entry=spk). On a DTB without
# the WSA link these csets fail. Playback is refused by the kernel gate (audio-speakers patch 0009) until the
# closed-loop protection is validated, so this profile cannot make the speakers audible today.
# Derived from alsa-ucm-conf master (PR 847) with two safety changes:
#  - PA Volume and the WSA digital volumes never exceed the kernel ceilings in
#    sound/soc/qcom/x1e80100.c (PA 6 = 0 dB, WSA RX 81 = -3 dB); boot value 72 = -12 dB. Upstream writes PA Volume 12 and
#    WSA RX 84; ALSA rejects values above platform_max with -EINVAL, so those cset lines would fail.
#  - Speakers start muted (PA Volume 0) until the user raises the volume.

SectionUseCase."HiFi" {
	File "/Qualcomm/x1e80100/Surface11-HiFi.conf"
	Comment "HiFi quality Music, speakers limited"
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wsa-init.File "/codecs/wsa884x/two-speakers/init.conf"
Include.wsam-init.File "/Qualcomm/x1e80100/Surface11-WsaInit.conf"
