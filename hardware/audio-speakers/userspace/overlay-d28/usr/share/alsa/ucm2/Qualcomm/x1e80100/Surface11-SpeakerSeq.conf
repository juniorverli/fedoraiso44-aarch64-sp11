# Based on /codecs/wsa884x/two-speakers/SpeakerSeq.conf.
# The D26/open-loop PA cap is 6 (0 dB); the closed-loop cap is 17 (+16.5 dB).
# This sequence writes 6 so the D26 entries keep exactly the same operating
# point. On closed-loop the "Speakers Volume" remap lets the session volume
# reach the raised cap (100% = 17); the kernel still clamps it.
# PA value 0 is minimum gain, not a mute; image policy must separately mute the sink at boot.
# Speakers Volume is a userspace remap, not an element on the hardware control used by UCM.
EnableSequence [
	cset "name='SpkrLeft COMP Switch' 1"
	cset "name='SpkrLeft BOOST Switch' 1"
	cset "name='SpkrLeft DAC Switch' 1"
	cset "name='SpkrLeft PBR Switch' 1"
	cset "name='SpkrLeft VISENSE Switch' 0"
	cset "name='SpkrLeft WSA MODE' 0"
	cset "name='SpkrRight COMP Switch' 1"
	cset "name='SpkrRight BOOST Switch' 1"
	cset "name='SpkrRight DAC Switch' 1"
	cset "name='SpkrRight PBR Switch' 1"
	cset "name='SpkrRight VISENSE Switch' 0"
	cset "name='SpkrRight WSA MODE' 0"
	cset "name='SpkrLeft PA Volume' 6"
	cset "name='SpkrRight PA Volume' 6"
	# Closed-loop operating point: 0 dBFS digital, matching the Windows maximum
	# (MaxEpVolume 0 dBFS). On a D26 topology the kernel platform_max is 81, so
	# this write is rejected and the boot value 72 stays; the speakers are
	# refused there anyway (kernel patch 0033).
	cset "name='WSA WSA_RX0 Digital Volume' 84"
	cset "name='WSA WSA_RX1 Digital Volume' 84"
	cset "name='WSA WSA_RX0_MIX Digital Volume' 84"
	cset "name='WSA WSA_RX1_MIX Digital Volume' 84"
]

DisableSequence [
	cset "name='SpkrLeft PA Volume' 0"
	cset "name='SpkrRight PA Volume' 0"
	cset "name='SpkrLeft COMP Switch' 0"
	cset "name='SpkrLeft BOOST Switch' 0"
	cset "name='SpkrLeft DAC Switch' 0"
	cset "name='SpkrLeft PBR Switch' 0"
	cset "name='SpkrLeft VISENSE Switch' 0"
	cset "name='SpkrRight COMP Switch' 0"
	cset "name='SpkrRight BOOST Switch' 0"
	cset "name='SpkrRight DAC Switch' 0"
	cset "name='SpkrRight PBR Switch' 0"
	cset "name='SpkrRight VISENSE Switch' 0"
]
