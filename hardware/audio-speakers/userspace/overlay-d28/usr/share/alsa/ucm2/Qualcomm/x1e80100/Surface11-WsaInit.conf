# Replaces /codecs/qcom-lpass/wsa-macro/init.conf (upstream 84 = 0 dB).
# D26/open-loop boot value: 72 = -12 dB (raw = dB + 84), 9 dB below the D26
# kernel cap (81 = -3 dB) and the same level as the Windows DEFAULT endpoint
# volume (-12 dBFS). The closed-loop entry keeps this boot value; its kernel cap
# is 84 (0 dB) and sp11-audio-safety raises these four controls to 84 only on the
# sp11.allow_nominal=1 entry, matching the Windows maximum (MaxEpVolume 0 dBFS)
# together with the +16.5 dB PA target. The kernel platform_max rejects the same
# write on D26/open-loop.
# The package remaps PA controls as Speakers Volume; these digital controls
# still have kernel caps.
# Control names carry the "WSA " prefix from sound-name-prefix in the DT.
BootSequence [
	cset "name='WSA WSA_RX0 Digital Volume' 72"
	cset "name='WSA WSA_RX1 Digital Volume' 72"
	cset "name='WSA WSA_RX0_MIX Digital Volume' 72"
	cset "name='WSA WSA_RX1_MIX Digital Volume' 72"
	cset "name='WSA WSA_COMP1 Switch' 0"
	cset "name='WSA WSA_COMP2 Switch' 0"
]
