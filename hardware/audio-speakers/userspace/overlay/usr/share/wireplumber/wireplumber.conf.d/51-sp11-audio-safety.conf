# Surface Pro 11 audio safety (see hardware/audio-speakers/evidence/2026-10-30-audio-plan.md).
# New sinks start at 5 % volume instead of WirePlumber's default 6.4 %. This is a convenience
# default; the hard limit is the ALSA control maximum set in the kernel (x1e80100.c).
wireplumber.settings = {
  device.routes.default-sink-volume = 0.05
}
