# Suspend is unproven on this device (see hardware/power-thermal/evidence/2026-10-31-suspend-thermal.md):
# a lid close must not put a test unit to sleep, and a sleeping unit loses the operator's log session.
# Opt in with sp11.suspend_lid on the kernel line: sp11-suspend-policy.service then writes
# /run/systemd/logind.conf.d/60-sp11-lid-suspend.conf, which sorts after this file and wins.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
