# sp11-camera-spectra: one camera stack per boot, chosen by the DTB.
#
# camera_x1e80100 is autoloaded by udev from the OF aliases of Qualcomm's nodes (qcom,cam-req-mgr, qcom,cam-sync,
# qcom,cci, qcom,csid695 ...), which exist only in the m15-spectra DTB. The module has no alias for qcom,cam-cpas
# or qcom,camera_x1e80100. The guard repeats the DT check for manual loads and refuses the upstream stack there.
softdep camera_x1e80100 pre: camcc_x1e80100
install camera_x1e80100 /usr/libexec/sp11-camera-spectra-guard load-if-spectra camera_x1e80100 $CMDLINE_OPTS
install qcom_camss /usr/libexec/sp11-camera-spectra-guard skip-if-spectra qcom_camss $CMDLINE_OPTS
install i2c_qcom_cci /usr/libexec/sp11-camera-spectra-guard skip-if-spectra i2c_qcom_cci $CMDLINE_OPTS
