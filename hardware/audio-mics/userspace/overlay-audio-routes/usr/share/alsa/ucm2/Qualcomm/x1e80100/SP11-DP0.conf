# USB-C port 0 DisplayPort audio: front end MultiMedia3 (PCM 2) to backend DISPLAY_PORT_RX_0.
# Mirrors the HDMI0 device of Fedora's T14s-HiFi.conf (same jack control name), with this card's front end.
SectionDevice."HDMI0" {
	Comment "USB-C / DisplayPort 0 playback"

	EnableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia3' 1"
	]

	DisableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia3' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},2"
		JackControl "DP0 Jack"
	}
}
