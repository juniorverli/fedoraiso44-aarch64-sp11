# SP11 audio routes (audio-mics, 2026-10-31). Included by If.SURFACEPro11 in x1e80100.conf right after the
# Surface Pro 11 card file, so this later SectionUseCase "HiFi" replaces the earlier one (alsa-lib keeps the
# last definition; tested with alsaucm, userspace/tests/ucm-routes-test.sh). No "Syntax" line on purpose: a second
# Syntax key in an included file is a merge error. The new verb file includes the earlier one (microphones in
# the default profile, speakers only in the gated speaker entry) and adds the SP11 route layer. No speaker
# device, mixer route or volume is defined here (S1/D26).

SectionUseCase."HiFi" {
	File "/Qualcomm/x1e80100/SP11-HiFi.conf"
	Comment "Internal microphones, USB-C DisplayPort audio"
}
