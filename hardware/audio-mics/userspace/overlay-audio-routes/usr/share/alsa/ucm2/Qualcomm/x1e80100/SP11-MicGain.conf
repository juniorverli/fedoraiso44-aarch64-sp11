# Default capture gain = the Windows endpoint default, +14.0 dB (surface_asdext8380.inf MicArray1: +14.0 default,
# +24.0 maximum). VA_DECn Volume: min 0, max 124, dBscale min -84.00 dB, step 1.00 dB, step 0 = mute
# (M13/M14 amixer dump), so dB = step - 84 and +14 dB = step 98. Cap: +24 dB = step 108, never exceeded here.
# Checked by userspace/tests/mic-gain-check.sh.
EnableSequence [
	cset "name='VA DEC0 MUX' VA_DMIC"
	cset "name='VA DMIC MUX0' DMIC0"
	cset "name='VA_AIF1_CAP Mixer DEC0' 1"
	cset "name='VA_DEC0 Volume' 98"
	cset "name='VA DEC1 MUX' VA_DMIC"
	cset "name='VA DMIC MUX1' DMIC1"
	cset "name='VA_AIF1_CAP Mixer DEC1' 1"
	cset "name='VA_DEC1 Volume' 98"
]

DisableSequence [
	cset "name='VA DMIC MUX0' ZERO"
	cset "name='VA DMIC MUX1' ZERO"
	cset "name='VA_AIF1_CAP Mixer DEC0' 0"
	cset "name='VA_AIF1_CAP Mixer DEC1' 0"
]
