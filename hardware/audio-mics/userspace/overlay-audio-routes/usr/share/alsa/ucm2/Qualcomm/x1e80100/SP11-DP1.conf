# USB-C port 1 DisplayPort audio: front end MultiMedia4 (PCM 3) to backend DISPLAY_PORT_RX_1.
# Mirrors the HDMI1 device of Fedora's T14s-HiFi.conf (same jack control name), with this card's front end.
SectionDevice."HDMI1" {
	Comment "USB-C / DisplayPort 1 playback"

	EnableSequence [
		cset "name='DISPLAY_PORT_RX_1 Audio Mixer MultiMedia4' 1"
	]

	DisableSequence [
		cset "name='DISPLAY_PORT_RX_1 Audio Mixer MultiMedia4' 0"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},3"
		JackControl "DP1 Jack"
	}
}
