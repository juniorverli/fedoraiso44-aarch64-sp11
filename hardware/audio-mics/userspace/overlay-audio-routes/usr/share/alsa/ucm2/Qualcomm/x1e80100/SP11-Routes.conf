# SP11 route layer: capture gain default and the two USB-C DisplayPort audio outputs.

# Capture gain: our include runs after the DMIC enable sequences of the base profile (which write
# VA_DECn Volume 100 = +16 dB), so its value is the one left on the controls.
SectionDevice."Mic" {
	Include.p3gain.File "/Qualcomm/x1e80100/SP11-MicGain.conf"
}

# DisplayPort audio exists only when the sound card has the DP links (device tree dp0-dai-link, dp1-dai-link),
# which create the "DP0 Jack" and "DP1 Jack" controls. Without them no device is offered, so no sink appears
# that cannot play. No device here touches a speaker control.
If.sp11dp0 {
	Condition {
		Type ControlExists
		Control "iface=CARD,name='DP0 Jack'"
	}
	True.Include.sp11dp0.File "/Qualcomm/x1e80100/SP11-DP0.conf"
}

If.sp11dp1 {
	Condition {
		Type ControlExists
		Control "iface=CARD,name='DP1 Jack'"
	}
	True.Include.sp11dp1.File "/Qualcomm/x1e80100/SP11-DP1.conf"
}
