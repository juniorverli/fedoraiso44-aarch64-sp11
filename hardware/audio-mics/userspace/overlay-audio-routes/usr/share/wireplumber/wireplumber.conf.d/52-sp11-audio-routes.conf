# Surface Pro 11 audio selection policy (audio-mics, 2026-10-31). Rules only: no volume, no unmute, no speaker
# control (S1/D26; the 5 % default sink volume stays in 51-sp11-audio-safety.conf of the audio-speakers overlay).
#
# WirePlumber picks the default node by priority.session, then by route priority (nodes of one card). Outputs:
#   Bluetooth 3000 > USB audio 2500 > built-in card (USB-C DisplayPort 1000, ranked above the speaker by its
#   UCM priority 200 against 100) . A plugged external output therefore wins over the built-in card, and the
#   DisplayPort sinks only exist while the DP jack control reports a cable (JackControl in the UCM).
# Inputs: the built-in microphones stay the default capture (2000); USB and Bluetooth inputs stay selectable
#   (1000) but are not taken as default. This also keeps a Bluetooth headset in A2DP, because nothing records
#   from it unless the user picks it (WirePlumber switches to the headset profile only for a recording client).
# The node names are unit independent: the built-in card is the platform device "sound"; USB nodes start with
# alsa_*.usb-; Bluetooth nodes start with bluez_*. (a Bluetooth address inside a name is never stored here).

monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.platform-sound.*" } ]
    actions = { update-props = { priority.driver = 1000, priority.session = 1000 } }
  }
  {
    matches = [ { node.name = "~alsa_input.platform-sound.*" } ]
    actions = { update-props = { priority.driver = 2000, priority.session = 2000 } }
  }
  {
    matches = [ { node.name = "~alsa_output.usb-.*" } ]
    actions = { update-props = { priority.driver = 2500, priority.session = 2500 } }
  }
  {
    matches = [ { node.name = "~alsa_input.usb-.*" } ]
    actions = { update-props = { priority.driver = 1000, priority.session = 1000 } }
  }
]

monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { priority.driver = 3000, priority.session = 3000 } }
  }
  {
    matches = [ { node.name = "~bluez_input.*" } ]
    actions = { update-props = { priority.driver = 1000, priority.session = 1000 } }
  }
]
