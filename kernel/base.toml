# Kernel base. Owner: kernel worker.
url = "https://github.com/juniorverli/sp11-linux.git"
tag = "v7.3"
commit = "c03c1a14507dfaf8b856c2608f9ac216021fc222"
dtb = "qcom/x1p64100-microsoft-denali.dtb"
localversion = ".sp11"

# Packaging base (D13). Facts verified 2026-10-24 against koji and src.fedoraproject.org.
# Fedora 44 ships kernel 7.2.12 (f44 branch, kernel-7.2.12-200.fc44); no 7.3 exists for F44.
# The only 7.3.0 final build is rawhide/F46: kernel-7.3.0-65.fc46 (koji buildID 3123812,
# built 2026-10-19). Its spec is used on the F44 container (dist and buildid are overridden).
[fedora_spec]
nevra = "kernel-7.3.0-65.fc46.src"
srpm_file = "kernel-7.3.0-65.fc46.src.rpm"
srpm_url = "https://kojipkgs.fedoraproject.org/packages/kernel/7.3.0/65.fc46/src/kernel-7.3.0-65.fc46.src.rpm"
srpm_sha256 = "38f6f2a9a59bf20faa65dbd1783aab7e50bddb83dbf1e09ca8deea40b6809c62"
koji_build = "https://koji.fedoraproject.org/koji/buildinfo?buildID=3123812"
dist_git = "https://src.fedoraproject.org/rpms/kernel/tree/dd506226d7aa65f6ed5251f17c6e93e7d4c4a126"
dist_git_commit = "dd506226d7aa65f6ed5251f17c6e93e7d4c4a126"
# Vanilla switch: `rpmbuild --with vanilla` -> %define with_vanilla (kernel.spec:324) -> nopatches=1 (:396),
# which drops Patch1 (patch-7.3-redhat.patch). Config hook: Source3001 `kernel-local`, merged by merge.py
# into every aarch64 config (kernel.spec:2158-2175). Base config: Source kernel-aarch64-fedora.config.
vanilla_switch = "--with vanilla"
config_hook = "kernel-local"
base_config = "kernel-aarch64-fedora.config"
# Our v7.3 tag as `git archive --prefix=linux-7.3/ v7.3 | xz -T4 -6` is byte-identical to the
# linux-7.3.tar.xz inside the Fedora SRPM (cmp, 2026-10-24).
tarball_sha256 = "c74322672a1fdd33acfc37480ece7554486d886d71bc5a49277dc5aba5fbcb4d"
buildid = ".sp11"
dist = ".fc44"

# Series revision: the RPM release is 65<buildid>.<series_rev><dist>, e.g. kernel-7.3.0-65.sp11.3.fc44.
# Bump series_rev whenever kernel/series or a patch in it changes, and set series_sha256 to the value
# scripts/kernel-build.sh prints (sha256 of the "<path> <patch sha256>" lines of kernel/series).
# 0 = M1 (empty series), 3 = M3 (display-lcd 0001-0003), 4 = M7 (nine patches), 5 = M8 (touch/QSPI, GPU off), 6 = M9 (rfkill, DMA32 CMA, USB-C diagnostics), 7 = M10 (GLINK OPEN_ACK diagnostic), 8 = M11 (FIFO diagnostic, packaged parity, audio safety/fragments), 9 = M12 (spi-hid-of supply fix F-09, audio safety 0004/0005), 10 = M13 (GPR fix, D26 gate, DSP 0003, ec-sam 0007, rear camera), 11 = M14 (closed-loop audio stage 2 0010-0016, camera C-PHY 0006-0010 and follow-ups 0011-0019), 12 = M15 (DisplayPort audio links 0017, AudioReach generic module blobs 0018, writable keep_proxy_pds, volume keys, built-in SCMI cpufreq, amended camera patches), 13 = M15.1 (WSA_CODEC_DMA_TX_0 2-channel speaker protection VI fix in patch 0015), 14 = M16 (V4L2 shared privacy LED arbitration and default-off GPU phase trace, explicitly enabled for this diagnostic build), 15 = M16.1 (i2c-qcom-cci: initialize every master completion; fixes the CCI1 master-1-only probe fault that is the leading hypothesis for the M16 safe DIE), 18 = M16.4 (public open-loop audio for safe/debug via patch 0022, closed-loop experiment on spk with the model name and the private CL topology, camera RGB-only DT exclusion, GPU firmware reserved-memory reservations, audio diagnostics/degraded candidates 0019/0020/0021), 19 = M16.5 (audio cap install at late probe, snd_soc_limit_volume return 1 fix; IOMMU DMA lazy matching the reference for the GPU reset candidate).
# 20 = camera CSIPHY/VFE register-window corrections and EFI-vars pstore; retain lazy DMA.
# kernel-build.sh and kernel-check fail on a mismatch.
series_rev = 20
series_sha256 = "93966ffa075153a8c59544b73f511ae7e14293bbf31ba37d669f7e216baf7b9a"
