# SP11 GRUB 2 configuration for the live ISO (decision D9, D10).
# Based on lorax-templates-generic 44.7 live/config_files/aarch64/grub2-efi.cfg.
# Changes against upstream are listed in image/README.md ("Lorax template changes").
#
# Words between at-signs (product, version, label, kernel, initrd, dtb, root, extra,
# all upper case) are replaced by image/lorax-templates/live/efi.tmpl at build time.
#
# Rules: the menu is always shown, every entry is verbose (no quiet, no rhgb, no
# Plymouth), every SP11 entry loads the DTB with `devicetree`. image-test-static.sh
# and image-build.sh fail when a "quiet" or "rhgb" word reaches any grub.cfg.

function load_video {
  if [ x$feature_all_video_module = xy ]; then
    insmod all_video
  else
    insmod efi_gop
    insmod efi_uga
    insmod ieee1275_fb
    insmod vbe
    insmod vga
    insmod video_bochs
    insmod video_cirrus
  fi
}

load_video
set gfxpayload=keep
insmod gzio
insmod part_gpt
insmod ext2

# Menu always shown, never hidden, never skipped.
set timeout_style=menu
set timeout=10
set default=0

search --no-floppy --set=root -l '@ISOLABEL@'

# Kernel command line common to every entry (image/README.md, "GRUB 2 and the kernel command line").
set sp11_common="@ROOT@ rd.live.image debug loglevel=8 ignore_loglevel printk.devkmsg=on log_buf_len=16M rd.plymouth=0 plymouth.enable=0 systemd.show_status=1 rd.udev.log_level=info console=tty0 @EXTRA@"

menuentry 'SP11 debug' --id sp11-debug --class fedora --class gnu-linux --class gnu --class os {
	linux @KERNELPATH@ $sp11_common sp11.entry=debug
	devicetree @DTBPATH@
	initrd @INITRDPATH@
}
menuentry 'SP11 debug + DRM trace' --id sp11-drm-trace --class fedora --class gnu-linux --class gnu --class os {
	linux @KERNELPATH@ $sp11_common drm.debug=0x1ff sp11.entry=drm-trace
	devicetree @DTBPATH@
	initrd @INITRDPATH@
}
menuentry 'SP11 debug nomodeset' --id sp11-nomodeset --class fedora --class gnu-linux --class gnu --class os {
	linux @KERNELPATH@ $sp11_common nomodeset sp11.entry=nomodeset
	devicetree @DTBPATH@
	initrd @INITRDPATH@
}
menuentry 'SP11 debug, stop in initramfs' --id sp11-initramfs --class fedora --class gnu-linux --class gnu --class os {
	linux @KERNELPATH@ $sp11_common rd.break=pre-mount sp11.entry=initramfs
	devicetree @DTBPATH@
	initrd @INITRDPATH@
}
# L1 only (QEMU virt): same kernel, no devicetree, so the firmware description is used.
# Serial console last so that systemd status and the L1 test see it on /dev/console.
menuentry 'VM test (no devicetree)' --id sp11-vmtest --class fedora --class gnu-linux --class gnu --class os {
	linux @KERNELPATH@ $sp11_common console=ttyAMA0,115200 sp11.entry=vmtest
	initrd @INITRDPATH@
}
