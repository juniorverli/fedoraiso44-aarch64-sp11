[Service]
# The private overlay is staged before RPM installation creates hexagonrpcd's UID.
# StateDirectory creates this writable child; the pre-start helper copies seeds only
# when it is empty and installs them with the service's runtime-resolved identity.
StateDirectory=
StateDirectory=hexagonrpcd hexagonrpcd/registry hexagonrpcd/registry/registry
ExecStartPre=+/usr/libexec/sp11/seed-private-sensor-registry /usr/libexec/sp11/private-sensor-seeds/registry /var/lib/hexagonrpcd/registry/registry hexagonrpcd fastrpc
