# Replaces /codecs/qcom-lpass/wsa-macro/init.conf (upstream 84 = 0 dB, above the kernel ceiling).
# D26 open-loop ceiling: 72 = -12 dB (raw = dB + 84), 9 dB below the kernel cap (81 = -3 dB) and the
# same level as the Windows DEFAULT endpoint volume (-12 dBFS), but with PA 0 dB instead of Windows' +16.5 dB.
# The package remaps PA controls as Speakers Volume; these digital controls still have kernel caps.
# Control names carry the "WSA " prefix from sound-name-prefix in the DT.
BootSequence [
	cset "name='WSA WSA_RX0 Digital Volume' 72"
	cset "name='WSA WSA_RX1 Digital Volume' 72"
	cset "name='WSA WSA_RX0_MIX Digital Volume' 72"
	cset "name='WSA WSA_RX1_MIX Digital Volume' 72"
	cset "name='WSA WSA_COMP1 Switch' 0"
	cset "name='WSA WSA_COMP2 Switch' 0"
]
