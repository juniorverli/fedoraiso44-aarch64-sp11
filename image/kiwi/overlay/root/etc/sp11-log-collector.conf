# SP11 log collector settings (kiwi layer). kiwi's embedded EFI system partition is labelled
# BOOT (mkdosfs -n BOOT in kiwi's grub2 bootloader code), not ANACONDA as with livemedia-creator.
ESP_LABEL=BOOT
# The embedded ESP is 64 MiB FAT32 (D17, about 52 MiB free): room for several boots, compressed.
# The lorax ISO had 6 MiB of space and the default cap below suits it; here more is allowed so the
# early display snapshot and a full snapshot of a few boots all stay (oldest boot is removed first).
CAP_ESP_KIB=32768
# M5: light display snapshots every 10 s, 18 times, right after the first full snapshot (default; for the record)
#FAST_COUNT=18
#FAST_INTERVAL=10
