# SP11 change 3 (kiwi layer): display drivers phase 1 needs in the initramfs for an early
# console. Names are Kbuild object names of the symbols in kernel/config/sp11.config, verified
# against sources/linux v7.3; check 5 of scripts/image-test-static.sh looks them up. dracut
# aborts when a name does not exist, which is the intended failure.
#
# M4: leds-qcom-lpg is the PMK8550 PWM provider. With display-lcd 0003 the panel references the
# backlight and the backlight needs that PWM, and panel_edp_probe() returns the
# drm_panel_of_backlight() error before panel detection (sources/linux/drivers/gpu/drm/panel/panel-edp.c:917-935).
# Without the provider in the initramfs the panel cannot probe there (surface-compare report 2d, Verified by
# CPIO inspection of the M3 initramfs).
# D20: qcom_q6v5_pas (DSP remoteproc) and what it needs early: its modules.dep closure (GLINK, SMEM, sysmon, mdt_loader ...)
# comes with it; qcom_pd_mapper, pdr_interface and the QRTR transport are runtime partners, named here.
add_drivers+=" msm panel-edp phy-qcom-edp drm_dp_aux_bus pwm_bl leds-qcom-lpg dispcc-x1e80100 qcom_q6v5_pas qcom_pd_mapper pdr_interface qrtr qrtr-smd "

# USB-C bridge chain needed for early msm component binding (usb-typec request).
add_drivers+=" ps883x pmic_glink pmic_glink_altmode phy-qcom-qmp-combo typec_ucsi ucsi_glink "

# ec-sam R3: transport, platform registry, KIP hub and HID are all needed before
# switch-root. dracut adds their modules.dep closure; hid_generic may be built in.
add_drivers+=" surface_aggregator surface_aggregator_registry surface_aggregator_hub surface_hid surface_hid_core hid hid_generic "
force_drivers+=" surface_aggregator surface_aggregator_registry surface_aggregator_hub surface_hid "

# M8: fixed is now modular, including the display supply provider. Keep the QSPI,
# DMA, HID and uinput chain early so touch and keyboard do not depend on switch-root.
add_drivers+=" fixed gpi spi-geni-qcom spi-hid spi-hid-of hid-multitouch uinput "
force_drivers+=" fixed gpi spi-geni-qcom spi-hid spi-hid-of hid-multitouch uinput "
