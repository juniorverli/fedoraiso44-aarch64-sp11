# SP11 initramfs settings of the kiwi image (decisions D9, D20). Overrides image/overlay/etc/dracut.conf.d/90-sp11.conf,
# which the livemedia-creator path still uses.

# No splash screen anywhere (decision D9).
omit_dracutmodules+=" plymouth "

# M4 (D20), superseding F1 for this image: the DSP remoteproc driver qcom_q6v5_pas and the four staged Denali DSP
# images are in the initramfs, as in the previous project's ISO, which reached GNOME. The driver requests its firmware
# once (request_firmware_nowait, no user-helper fallback), so the firmware must be readable when it binds. The driver
# and its dependencies (GLINK, SMEM, PDR, QRTR, pd-mapper) are in 91-sp11-drivers.conf. The GPU zap shader and
# gen70500 stay out: msm_open() loads them at the first open (surface-compare report 2d). Entry
# "SP11 debug, no early DSP" blacklists the driver in the initramfs (rd.driver.blacklist=qcom_q6v5_pas) to compare.
install_items+=" /usr/lib/firmware/qcom/x1e80100/microsoft/Denali/qcadsp8380.mbn /usr/lib/firmware/qcom/x1e80100/microsoft/Denali/adsp_dtb.mbn /usr/lib/firmware/qcom/x1e80100/microsoft/Denali/qccdsp8380.mbn /usr/lib/firmware/qcom/x1e80100/microsoft/Denali/cdsp_dtb.mbn "
