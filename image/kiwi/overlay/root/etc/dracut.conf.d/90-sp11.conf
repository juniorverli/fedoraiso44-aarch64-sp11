# SP11 initramfs settings of the kiwi image (decisions D9, D20). Overrides image/overlay/etc/dracut.conf.d/90-sp11.conf,
# which the livemedia-creator path still uses.

# No splash screen anywhere (decision D9).
omit_dracutmodules+=" plymouth "

# M4 (D20), superseding F1 for this image: the DSP remoteproc driver qcom_q6v5_pas and the four staged Denali DSP
# images are in the initramfs, as in the previous project's ISO, which reached GNOME. The driver requests its firmware
# once (request_firmware_nowait, no user-helper fallback), so the firmware must be readable when it binds. The driver
# and its dependencies (GLINK, SMEM, PDR, QRTR, pd-mapper) are in 91-sp11-drivers.conf.
# Stage DSP firmware and GPU SQE/GMU firmware + zap shader in initramfs for early in-kernel DRM open.
install_items+=" /usr/lib/firmware/qcom/x1e80100/microsoft/Denali/qcadsp8380.mbn /usr/lib/firmware/qcom/x1e80100/microsoft/Denali/adsp_dtb.mbn /usr/lib/firmware/qcom/x1e80100/microsoft/Denali/qccdsp8380.mbn /usr/lib/firmware/qcom/x1e80100/microsoft/Denali/cdsp_dtb.mbn /usr/lib/firmware/qcom/gen70500_sqe.fw.xz /usr/lib/firmware/qcom/gen70500_gmu.bin.xz /usr/lib/firmware/qcom/x1e80100/microsoft/qcdxkmsuc8380.mbn "

# D23/S6: SAM owns the battery; retain ucsi_glink for USB-C power information.
omit_drivers+=" qcom_battmgr "
# dracut's modconf module may prune policy for omitted drivers; install it explicitly.
install_items+=" /etc/modprobe.d/50-sp11-battery.conf "
