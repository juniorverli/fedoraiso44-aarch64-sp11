# SP11 interactive installation kickstart.
#
# No storage commands on purpose: Anaconda asks for the disk and the user picks
# "Install alongside" (or custom partitioning) so the Windows partitions are
# kept. The two %post sections only configure the installed system:
#   - the UEFI boot fix (this firmware does not run shim);
#   - the dual-boot/GPU defaults and the identity cleanup.
#
# Vendor firmware and tuning are not part of this file; run
# scripts/sp11-local-stage.sh on the installed machine to generate them from
# the user's own Windows data.

lang en_US.UTF-8
keyboard us

%post --nochroot --log=/mnt/sysroot/root/sp11-install-boot.log
/usr/libexec/sp11/post-install-boot /mnt/sysroot
%end

%post --log=/root/sp11-install.log
/usr/libexec/sp11/post-install --installed
%end
