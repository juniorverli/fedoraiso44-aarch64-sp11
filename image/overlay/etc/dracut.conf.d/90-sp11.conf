# SP11 initramfs settings (read by dracut inside the image chroot, so also by
# livemedia-creator's initrd rebuild).

# No splash screen anywhere (decision D9).
omit_dracutmodules+=" plymouth "

# Decision F1 (firmware worker request): qcom_q6v5_pas requests the DSP firmware once
# (request_firmware_nowait, no user-helper fallback). The five staged DSP/GPU blobs live in
# /usr/lib/firmware of the root file system, which the initramfs does not have. Keep the
# remoteproc driver out of the initramfs: udev loads it after switch-root, when the
# firmware is readable. Display drivers stay in the initramfs for an early console.
omit_drivers+=" qcom_q6v5_pas "

# Display drivers phase 1 needs early are added by the kickstart %post into
# /etc/dracut.conf.d/91-sp11-drivers.conf, only for modules the installed kernel has:
# dracut aborts the whole initramfs when an add_drivers name does not exist.

# D23/S6: SAM owns the battery; retain ucsi_glink for USB-C power information.
omit_drivers+=" qcom_battmgr "
install_items+=" /etc/modprobe.d/50-sp11-battery.conf "
