# M15 image drop-in: the sampler is enabled by the marker file sp11/enable-thermal-sample on the boot medium (sp11-boot-state) instead of the
# kernel argument sp11.thermal_log, because the M15 command line is static. The empty assignment resets the owner's
# ConditionKernelCommandLine=sp11.thermal_log; ExecCondition (exit 1 = condition false, the unit is skipped, not failed) reads the marker.
# Mode: tsens zones, cpufreq and battery (the SAM hwmon/fan mode needs sp11.thermal_log=sam on a line edited with `e`).
[Unit]
ConditionKernelCommandLine=

[Service]
ExecCondition=/usr/libexec/sp11-boot-state marker enable-thermal-sample
