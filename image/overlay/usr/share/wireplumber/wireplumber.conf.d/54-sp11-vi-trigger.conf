# The MultiMedia5 capture PCM is the V/I sense trigger of the closed-loop
# speaker protection topology. It carries no audio, is held open by
# sp11-closed-loop-sense.service and must never appear as a microphone or be
# selected as the default source. Hide it from applications.
monitor.alsa.rules = [
  {
    matches = [
      { node.description = "~*MultiMedia5*" }
      { node.name = "~*MultiMedia5*" }
    ]
    actions = { update-props = { node.disabled = true } }
  }
]
