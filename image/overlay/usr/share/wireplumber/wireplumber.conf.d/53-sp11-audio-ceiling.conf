# The ceiling is enforced by the kernel, per mode:
#   D26/open-loop: PA <= 6 (0 dB), WSA RX/MIX <= 81 (-3 dB), UCM boot 72
#                  (-12 dB).
#   closed-loop:   PA <= 17 (+16.5 dB), WSA RX/MIX <= 84 (0 dB); the UCM
#                  boot value is still 72, and sp11-audio-safety raises the
#                  digital controls to 84 only on the sp11.allow_nominal=1
#                  entry. The kernel platform_max is the authority and rejects
#                  the same write on D26/open-loop. The PA follows the
#                  "Speakers Volume" remap; a 100% sink should reach 17
#                  (runtime confirmation pending).
# WirePlumber has no max-volume property; the startup mute and the 100%
# level are set by sp11-audio-safety.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.platform-sound.*" } ]
    actions = { update-props = {
      api.acp.disable-pro-audio = true
      device.routes.default-sink-volume = 0.0
    } }
  }
]
