# D28: retain the -12 dBFS ACP ceiling and the PA 6 gain.
# The startup helper sets the usable 30% level only after muting the sink.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.platform-sound.*" } ]
    actions = { update-props = {
      api.acp.max-volume = 0.251
      api.acp.disable-pro-audio = true
      device.routes.default-sink-volume = 0.0
    } }
  }
]
