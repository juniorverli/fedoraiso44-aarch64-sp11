# D28: 1.0 (0 dBFS) matches Windows MaxEpVolume; see
# hardware/audio-speakers/evidence/2026-10-30-argon-rea-report.md, section 5.
# The ~19.5 dB open-loop deficit combines -3 dB RX with PA gain 0 dB
# versus Windows +16.5 dB; only a validated SPv5 closed-loop experiment can
# recover it, not a software ceiling. Kernel caps and startup mute remain.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.platform-sound.*" } ]
    actions = { update-props = {
      api.acp.max-volume = 1.0
      api.acp.disable-pro-audio = true
      device.routes.default-sink-volume = 0.0
    } }
  }
]
