# The ceiling is kernel PA <= 6 (0 dB), WSA RX/MIX <= 81 (-3 dB),
# and UCM digital volume 72 (-12 dB), with startup mute.
# WirePlumber has no max-volume property.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.platform-sound.*" } ]
    actions = { update-props = {
      api.acp.disable-pro-audio = true
      device.routes.default-sink-volume = 0.0
    } }
  }
]
